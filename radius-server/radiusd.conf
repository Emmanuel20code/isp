# Minimal configuration for RadSec over Tailscale
# Binding to 127.0.0.1 prevents address conflict.

instantiate {
    sql
}

listen {
    type = auth
    ipaddr = 0.0.0.0
    port = 1812
    proto = udp
}

listen {
    type = acct
    ipaddr = 0.0.0.0
    port = 1813
    proto = udp
}

listen {
    type = coa
    ipaddr = 0.0.0.0
    port = 3799
    proto = udp
}

client tailscale-clients {
    ipaddr = 100.64.0.0/10
    secret = ${env:RADIUS_SECRET}
    shortname = tailscale-network
}
