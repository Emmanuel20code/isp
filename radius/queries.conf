# -*- text -*-
##
## queries.conf -- PostgreSQL queries for EMMATECH Multi-Tenant FreeRADIUS
##

# Safe quoting
safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

#######################################################################
#  Authorization Queries
#######################################################################
# Check user credentials and status directly from the synchronized radcheck table
authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM radcheck \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

# Return reply attributes (Mikrotik-Rate-Limit, Session-Timeout, Framed-Protocol)
authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM radreply \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

# Group queries
authorize_group_check_query = "\
	SELECT id, groupname, attribute, value, op \
	FROM radgroupcheck \
	WHERE groupname = '%{control:SQL-Group}' \
	ORDER BY id"

authorize_group_reply_query = "\
	SELECT id, groupname, attribute, value, op \
	FROM radgroupreply \
	WHERE groupname = '%{control:SQL-Group}' \
	ORDER BY id"

usergroup_query = "\
	SELECT groupname \
	FROM radusergroup \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

group_membership_query = "\
	SELECT groupname \
	FROM radusergroup \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

#######################################################################
#  Post-Auth Queries (Log Access-Accept and Access-Reject)
#######################################################################
postauth_query = "\
	INSERT INTO radpostauth (username, pass, reply, authdate, nasipaddress, callingstationid) \
	VALUES ( \
		'%{SQL-User-Name}', \
		'%{%{User-Password}:-******}', \
		'%{reply:Packet-Type}', \
		NOW(), \
		'%{%{NAS-IP-Address}:-%{Packet-Src-IP-Address}}', \
		'%{Calling-Station-Id}' \
	)"

#######################################################################
#  Accounting Queries
#######################################################################
accounting_start_query = "\
	INSERT INTO radacct ( \
		acctsessionid, acctuniqueid, username, realm, nasipaddress, \
		nasportid, nasporttype, acctstarttime, acctupdatetime, \
		acctstoptime, acctsessiontime, acctauthentic, connectinfo_start, \
		connectinfo_stop, acctinputoctets, acctoutputoctets, calledstationid, \
		callingstationid, acctterminatecause, servicetype, framedprotocol, \
		framedipaddress \
	) VALUES ( \
		'%{Acct-Session-Id}', \
		'%{Acct-Unique-Session-Id}', \
		'%{SQL-User-Name}', \
		'%{Realm}', \
		'%{%{NAS-IP-Address}:-%{Packet-Src-IP-Address}}', \
		'%{NAS-Port-Id}', \
		'%{NAS-Port-Type}', \
		TO_TIMESTAMP(%{integer:Event-Timestamp}), \
		TO_TIMESTAMP(%{integer:Event-Timestamp}), \
		NULL, \
		0, \
		'%{Acct-Authentic}', \
		'%{Connect-Info}', \
		'', \
		0, \
		0, \
		'%{Called-Station-Id}', \
		'%{Calling-Station-Id}', \
		'', \
		'%{Service-Type}', \
		'%{Framed-Protocol}', \
		NULLIF('%{Framed-IP-Address}', '')::inet \
	)"

accounting_update_query = "\
	UPDATE radacct SET \
		acctupdatetime = TO_TIMESTAMP(%{integer:Event-Timestamp}), \
		acctsessiontime = COALESCE(%{%{Acct-Session-Time}:-NULL}, (%{integer:Event-Timestamp} - EXTRACT(EPOCH FROM acctstarttime)::INTEGER)), \
		acctinputoctets = (('%{Acct-Input-Gigawords:-0}'::bigint << 32) + '%{Acct-Input-Octets:-0}'::bigint), \
		acctoutputoctets = (('%{Acct-Output-Gigawords:-0}'::bigint << 32) + '%{Acct-Output-Octets:-0}'::bigint), \
		framedipaddress = NULLIF('%{Framed-IP-Address}', '')::inet \
	WHERE acctsessionid = '%{Acct-Session-Id}' AND username = '%{SQL-User-Name}'"

accounting_stop_query = "\
	UPDATE radacct SET \
		acctstoptime = TO_TIMESTAMP(%{integer:Event-Timestamp}), \
		acctsessiontime = COALESCE(%{%{Acct-Session-Time}:-NULL}, (%{integer:Event-Timestamp} - EXTRACT(EPOCH FROM acctstarttime)::INTEGER)), \
		acctinputoctets = (('%{Acct-Input-Gigawords:-0}'::bigint << 32) + '%{Acct-Input-Octets:-0}'::bigint), \
		acctoutputoctets = (('%{Acct-Output-Gigawords:-0}'::bigint << 32) + '%{Acct-Output-Octets:-0}'::bigint), \
		acctterminatecause = '%{Acct-Terminate-Cause}', \
		connectinfo_stop = '%{Connect-Info}' \
	WHERE acctsessionid = '%{Acct-Session-Id}' AND username = '%{SQL-User-Name}'"

#######################################################################
#  Dynamic Clients (NAS) Query
#######################################################################
client_query = "\
	SELECT id, nasname, shortname, type, secret, server \
	FROM nas"
