# -*- text -*-
##
## radiusd.conf -- FreeRADIUS Master Configuration for EMMATECH Billing
##

prefix = /usr
exec_prefix = /usr
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
logdir = /var/log/freeradius
raddbdir = /etc/freeradius/3.0
run_dir = ${localstatedir}/run/${name}

name = freeradius

# Multi-threaded request processing
max_request_time = 30
cleanup_delay = 5
max_requests = 16384
hostname_lookups = no

# Logging to standard output for Docker and container monitoring
log {
	destination = stdout
	colourise = yes
	file = ${logdir}/radius.log
	syslog_facility = daemon
	stripped_names = no
	auth = yes
	auth_badpass = yes
	auth_goodpass = yes
	msg_denied = "You are not authorized to access this service."
}

# Check for security
security {
	user = freerad
	group = freerad
	allow_core_dumps = no
	max_attributes = 200
	reject_delay = 1
	status_server = yes
}

# Vendor dictionaries
$INCLUDE dictionary
$INCLUDE dictionary.mikrotik

# Dynamic clients configuration
$INCLUDE clients.conf

# Modules and Sites
modules {
	$INCLUDE mods-enabled/
}

# Virtual servers
$INCLUDE sites-enabled/
