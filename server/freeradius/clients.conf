# -*- text -*-
##
## clients.conf -- RADIUS Client Configuration
##

# Localhost testing client (for automated health checks and verification)
client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = testing123
	require_message_authenticator = no
	nas_type = other
	limit {
		max_connections = 16
		lifetime = 0
		idle_timeout = 30
	}
}

client localhost_ipv6 {
	ipv6addr = ::1
	secret = testing123
}

# Docker bridge / internal container networks
client docker_network {
	ipaddr = 172.16.0.0/12
	secret = @@RADIUS_SECRET@@
	nas_type = mikrotik
}

# Global MikroTik network listener (allows remote ISP routers with shared secret)
client all_routers {
	ipaddr = 0.0.0.0/0
	secret = "${env:RADIUS_SECRET}"
	shortname = external-mikrotik
	nas_type = mikrotik
	require_message_authenticator = no
	limit {
		max_connections = 256
		lifetime = 0
		idle_timeout = 30
	}
}
